name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      production_amd64:
        description: Build a versioned image for production amd64 nodes
        type: boolean
        default: true
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is now derived directly from the repository name in the steps below
  # This is the recommended practice by the docker/metadata-action
  # env.IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The packages permission is required to push to the GitHub Container Registry
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the pinned PHP version
        id: php
        run: |
          version="$(sed -n 's/^ARG PHP_VERSION=//p' Dockerfile)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # Push "master" tag for pushes to the master branch
            type=ref,event=branch,enable=${{ github.event_name != 'workflow_dispatch' || !inputs.production_amd64 }}
            type=raw,value=php-${{ steps.php.outputs.version }}-amd64,enable=${{ github.event_name == 'workflow_dispatch' && inputs.production_amd64 }}
            
            # push semantic version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            
            # push latest tag for the default branch
            type=schedule,pattern=latest,branch=master

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name != 'workflow_dispatch' || !inputs.production_amd64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # This builds and pushes all platforms in a single step
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.production_amd64 && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # The push flag is essential to actually push the image to the registry
          push: true
          pull: true
          # The tags are derived from the metadata step
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caching helps to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          echo "Image successfully pushed. Inspecting the final manifest:"
          docker buildx imagetools inspect ${{ steps.meta.outputs.tags }}
